<!DOCTYPE html>
<html lang="ru" data-theme="abyss">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyTactics — варианты палитр</title>
<link rel="stylesheet" href="css/universe.css">
<style>
  body{background:#0a0a0f}
  .tcase{border:1px solid #3a3a4a;border-radius:16px;margin:20px 0;overflow:hidden}
  .tcase .tlabel{padding:12px 16px;background:#00000088;color:#fff;font-size:15px}
  .tcase .tlabel b{font-size:17px}
  .tcase .tbody{padding:14px}
  .pagehead{max-width:1100px;margin:0 auto;padding:18px 12px 0;color:#e6edf3}
  .pagehead p{color:#8b949e}
</style>
</head>
<body>
<div class="pagehead">
  <h1>🎨 Палитры PyTactics — 5 вариантов</h1>
  <p>Меняется только цвет (структура и вёрстка те же). Состояния планет везде одинаковые:
  пройдена ★★★ → открыта → закрыта 🔒. Выбранная тема применяется на главной точками в шапке.</p>
</div>
<div class="uni" id="cases"></div>
<script src="js/levels.js"></script>
<script>
(function () {
  var THEMES = [
    { id: "nebula", name: "1. Небула", mood: "текущая — розово-синий неон, у каждой галактики своё свечение" },
    { id: "abyss", name: "2. Бездна", mood: "строгая ледяная — холодные акценты, самый тёмный фон" },
    { id: "nova", name: "3. Нова", mood: "тёплая солнечная — оранжево-золотая, самая яркая и «вкусная»" },
    { id: "emerald", name: "4. Изумруд", mood: "зелёная «матрица» — спокойный монохром + бирюза" },
    { id: "royal", name: "5. Корона", mood: "фиолетовая — мягкая, сказочная, меньше неона" }
  ];
  var GAL = [
    { cls: "g1", gname: "🌀 Галактика «Логика»", states: ["done", "open"] },
    { cls: "g2", gname: "🌌 Галактика «Старт»", states: ["done", "open", "locked"] },
    { cls: "g3", gname: "☄️ Галактика «Алгоритмы»", states: ["done", "open", "locked"] }
  ];
  var lv = {};
  window.LEVELS.forEach(function (l) { lv[l.id] = l; });
  var levelIds = { g1: [3, 4], g2: [1, 2, 5], g3: [6, 7, 8] };
  var PTYPE = { 1: "rock", 2: "gas", 3: "city", 4: "rock", 5: "ice", 6: "lava", 7: "ice", 8: "ring" };
  var box = document.getElementById("cases");
  THEMES.forEach(function (t) {
    var sec = document.createElement("section");
    sec.className = "tcase";
    sec.setAttribute("data-theme", t.id);
    var html = "<div class='tlabel'><b>" + t.name + "</b> — " + t.mood + "</div><div class='tbody'>";
    html += "<div class='topbar'><div class='logo'>🤖⚔️</div><div><h1>PyTactics <span>/ Карта вселенной</span></h1>"
      + "<div class='sub'>Пошаговая Python-стратегия · 3 галактики · 8 планет</div></div>"
      + "<div class='spacer'></div><button class='authbtn'>Войти / Регистрация</button></div>";
    html += "<div class='statbar' style='display:flex;gap:10px;margin:12px 0'>"
      + "<div class='stat'>★ 7/24</div><div class='stat'>🪐 Пройдено: 3/8</div><div class='stat'>☁️ Облако</div></div>";
    GAL.forEach(function (g) {
      html += "<section class='galaxy " + g.cls + "'><h3>" + g.gname + "</h3>"
        + "<div class='gdesc'>Описание галактики · тема учебника</div><div class='planets'>";
      var ids = levelIds[g.cls];
      for (var i = 0; i < ids.length; i++) {
        var l = lv[ids[i]], st = g.states[Math.min(i, g.states.length - 1)];
        var open = st !== "locked";
        html += "<div class='planet" + (open ? "" : " locked") + "'><div class='orb pt-" + (PTYPE[ids[i]] || "rock") + "'>"
          + (open ? l.id : "🔒") + "</div><div class='pnum'>Планета " + l.id + "</div>"
          + "<div class='pname'>" + l.title + "</div><div class='ptopic'>" + l.topic + "</div>"
          + "<div class='pstars'>" + (st === "done" ? "★★★" : st === "open" ? "— не пройдена —" : "— закрыта —") + "</div></div>";
      }
      html += "</div></section>";
    });
    html += "<div style='padding:0 0 6px'><button class='authbtn'>▶ Продолжить: уровень 4</button></div>";
    html += "</div>";
    sec.innerHTML = html;
    box.appendChild(sec);
  });
})();
</script>
</body>
</html>
